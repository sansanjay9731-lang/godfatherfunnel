<svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded Obsidian / Dark Background -->
  <rect width="40" height="40" rx="10" fill="#0A0A0F"/>
  <rect width="38" height="38" x="1" y="1" rx="9" fill="#12121A" stroke="#FFFFFF" stroke-opacity="0.1"/>

  <!-- High-Precision Vector Funnel + AI Node Emblem -->
  <!-- Top Funnel Bar -->
  <path d="M 9 11 L 31 11 L 24 21 L 16 21 Z" fill="url(#fav-grad-top)"/>
  <!-- Stem / Column -->
  <path d="M 16 22 L 24 22 L 21 30 L 19 30 Z" fill="url(#fav-grad-bot)"/>
  <!-- Precision Center Node -->
  <circle cx="20" cy="16" r="2.5" fill="#FFFFFF"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="fav-grad-top" x1="9" y1="11" x2="31" y2="21" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="fav-grad-bot" x1="16" y1="22" x2="24" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
</svg>
